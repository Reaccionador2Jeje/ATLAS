[package]
name = "atlas"
version = "0.1.0"
edition = "2024"
description = "ATLAS modular technology ecosystem core"
license = "Apache-2.0"
repository = "https://github.com/Reaccionador2Jeje/ATLAS"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
